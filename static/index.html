<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Inventory System</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --line: #e8ecf3;
      --ink: #1e293b;
      --muted: #64748b;
      --brand: #4f46e5;
      --brand-2: #7c3aed;
      --brand-soft: #eef2ff;
      --green: #059669;
      --amber: #d97706;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .05);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0; background: var(--bg); color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
      color: #fff; padding: 1.4rem 1.5rem;
      box-shadow: 0 4px 20px rgba(79, 70, 229, .25);
    }
    .header-inner { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: .75rem; }
    header h1 { margin: 0; font-size: 1.3rem; font-weight: 700; letter-spacing: -.01em; }
    header .sub { margin: .15rem 0 0; font-size: .82rem; opacity: .85; font-weight: 400; }
    .logo {
      width: 42px; height: 42px; display: grid; place-items: center;
      background: rgba(255, 255, 255, .18); border-radius: 12px; font-size: 1.3rem;
    }

    main { max-width: 1040px; margin: 1.5rem auto; padding: 0 1rem; display: grid; gap: 1.25rem; }

    /* Summary stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
    .stat {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 1rem 1.1rem; box-shadow: var(--shadow);
    }
    .stat .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    .stat .value { font-size: 1.7rem; font-weight: 700; margin-top: .2rem; letter-spacing: -.02em; }
    .stat .value.warn { color: var(--amber); }
    .stat .value.bad { color: var(--red); }

    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 1.4rem; box-shadow: var(--shadow);
    }
    .card h2 {
      margin: 0 0 1.1rem; font-size: .95rem; font-weight: 700;
      display: flex; align-items: center; gap: .5rem;
    }
    .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }

    label { display: block; font-size: .76rem; color: var(--muted); margin-bottom: .3rem; font-weight: 600; }
    input, select {
      width: 100%; padding: .58rem .65rem; border: 1px solid var(--line); border-radius: 9px;
      font: inherit; background: #fbfcfe; color: var(--ink); transition: border-color .15s, box-shadow .15s;
    }
    input:focus, select:focus {
      outline: none; border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .14); background: #fff;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .85rem; }

    button {
      background: var(--brand); color: #fff; border: 0; padding: .58rem 1.1rem; border-radius: 9px;
      cursor: pointer; font: inherit; font-weight: 600; transition: transform .08s, filter .15s, background .15s;
    }
    button:hover { filter: brightness(1.07); }
    button:active { transform: translateY(1px); }
    button.ghost { background: var(--brand-soft); color: var(--brand); }
    button.danger { background: var(--red-soft); color: var(--red); }
    button.icon { padding: .4rem .6rem; font-size: .85rem; line-height: 1; }

    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    thead th {
      color: var(--muted); font-weight: 600; font-size: .72rem; text-transform: uppercase;
      letter-spacing: .04em; text-align: left; padding: .6rem .7rem; border-bottom: 2px solid var(--line);
    }
    tbody td { padding: .7rem .7rem; border-bottom: 1px solid var(--line); }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: #f8faff; }
    tbody tr:last-child td { border-bottom: 0; }
    .name-cell { font-weight: 600; }
    .desc { font-size: .76rem; color: var(--muted); font-weight: 400; margin-top: .1rem; }

    .toolbar { display: flex; gap: .6rem; flex-wrap: wrap; align-items: end; }
    .toolbar > div { flex: 1; min-width: 150px; }
    .row-actions { display: flex; gap: .35rem; }

    .err { color: var(--red); font-size: .82rem; min-height: 1.2em; font-weight: 500; }
    .pill {
      background: var(--brand-soft); color: var(--brand); padding: .2rem .55rem;
      border-radius: 999px; font-size: .74rem; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .cat-tag { font-size: .82rem; color: var(--muted); }

    .badge {
      display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .6rem;
      border-radius: 999px; font-size: .76rem; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.ok { background: #ecfdf5; color: var(--green); }
    .badge.low { background: #fffbeb; color: var(--amber); }
    .badge.out { background: var(--red-soft); color: var(--red); }

    .empty { text-align: center; color: var(--muted); padding: 2rem !important; }
    footer { text-align: center; color: var(--muted); font-size: .78rem; padding: 1rem 0 2rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">📦</div>
      <div>
        <h1>Mini Inventory System</h1>
        <p class="sub">Manage products, categories &amp; stock levels</p>
      </div>
    </div>
  </header>

  <main>
    <section class="stats">
      <div class="stat"><div class="label">Products</div><div class="value" id="s-products">0</div></div>
      <div class="stat"><div class="label">Categories</div><div class="value" id="s-categories">0</div></div>
      <div class="stat"><div class="label">Total Stock</div><div class="value" id="s-stock">0</div></div>
      <div class="stat"><div class="label">Low / Out</div><div class="value warn" id="s-low">0</div></div>
    </section>

    <section class="card">
      <h2><span class="dot"></span>Add Product</h2>
      <div class="grid">
        <div><label>Name</label><input id="p-name" placeholder="e.g. Wireless Mouse" /></div>
        <div><label>SKU</label><input id="p-sku" placeholder="e.g. ELEC-009" /></div>
        <div><label>Price</label><input id="p-price" type="number" step="0.01" value="0" /></div>
        <div><label>Stock</label><input id="p-stock" type="number" value="0" /></div>
        <div><label>Category</label><select id="p-category"></select></div>
        <div><label>Description</label><input id="p-desc" placeholder="Optional" /></div>
      </div>
      <div style="margin-top:1rem; display:flex; gap:.75rem; align-items:center;">
        <button onclick="addProduct()">+ Add Product</button>
        <span class="err" id="p-err"></span>
      </div>
    </section>

    <section class="card">
      <h2><span class="dot"></span>Add Category</h2>
      <div class="toolbar">
        <div><label>Category name</label><input id="c-name" placeholder="e.g. Hardware" /></div>
        <button class="ghost" onclick="addCategory()">+ Add Category</button>
        <span class="err" id="c-err"></span>
      </div>
    </section>

    <section class="card">
      <h2><span class="dot"></span>Products</h2>
      <div class="toolbar" style="margin-bottom:1.1rem;">
        <div><label>Search (name / SKU)</label><input id="f-search" oninput="loadProducts()" placeholder="🔍  Type to search…" /></div>
        <div><label>Filter by category</label><select id="f-category" onchange="loadProducts()"></select></div>
        <button class="ghost" onclick="resetFilters()">Reset</button>
      </div>
      <table>
        <thead>
          <tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <footer>Mini Inventory System · FastAPI + SQLite</footer>
  </main>

  <script>
    const LOW_STOCK = 50;  // threshold for the "low" badge

    const api = (path, opts) => fetch(path, opts).then(async r => {
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
      return r.status === 204 ? null : r.json();
    });

    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function stockBadge(qty) {
      if (qty <= 0) return `<span class="badge out">Out of stock</span>`;
      if (qty < LOW_STOCK) return `<span class="badge low">${qty} left</span>`;
      return `<span class="badge ok">${qty} in stock</span>`;
    }

    async function loadCategories() {
      const cats = await api('/api/categories');
      document.getElementById('s-categories').textContent = cats.length;
      document.getElementById('p-category').innerHTML =
        '<option value="">— none —</option>' +
        cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
      document.getElementById('f-category').innerHTML =
        '<option value="">All categories</option>' +
        cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
    }

    async function loadProducts() {
      const search = document.getElementById('f-search').value.trim();
      const cat = document.getElementById('f-category').value;
      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (cat) params.set('category_id', cat);
      const products = await api('/api/products?' + params.toString());

      // Summary stats (reflect the current, unfiltered-ish view)
      document.getElementById('s-products').textContent = products.length;
      document.getElementById('s-stock').textContent =
        products.reduce((sum, p) => sum + p.stock_quantity, 0).toLocaleString();
      const low = products.filter(p => p.stock_quantity < LOW_STOCK).length;
      const lowEl = document.getElementById('s-low');
      lowEl.textContent = low;
      lowEl.className = 'value ' + (low === 0 ? '' : low > 2 ? 'bad' : 'warn');

      document.getElementById('rows').innerHTML = products.map(p => `
        <tr>
          <td class="name-cell">${esc(p.name)}${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}</td>
          <td><span class="pill">${esc(p.sku)}</span></td>
          <td><span class="cat-tag">${p.category ? esc(p.category.name) : '—'}</span></td>
          <td>$${Number(p.price).toFixed(2)}</td>
          <td>${stockBadge(p.stock_quantity)}</td>
          <td class="row-actions">
            <button class="ghost icon" title="Add one" onclick="adjust(${p.id}, 1)">＋</button>
            <button class="ghost icon" title="Remove one" onclick="adjust(${p.id}, -1)">－</button>
            <button class="danger icon" title="Delete" onclick="removeProduct(${p.id})">🗑</button>
          </td>
        </tr>`).join('') ||
        '<tr><td colspan="6" class="empty">No products found. Try clearing the filters.</td></tr>';
    }

    async function addProduct() {
      const err = document.getElementById('p-err');
      err.textContent = '';
      const body = {
        name: document.getElementById('p-name').value.trim(),
        sku: document.getElementById('p-sku').value.trim(),
        price: parseFloat(document.getElementById('p-price').value || '0'),
        stock_quantity: parseInt(document.getElementById('p-stock').value || '0', 10),
        description: document.getElementById('p-desc').value.trim() || null,
        category_id: document.getElementById('p-category').value || null,
      };
      try {
        await api('/api/products', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        ['p-name', 'p-sku', 'p-desc'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('p-price').value = '0';
        document.getElementById('p-stock').value = '0';
        await loadProducts();
      } catch (e) { err.textContent = e.message; }
    }

    async function addCategory() {
      const err = document.getElementById('c-err');
      err.textContent = '';
      try {
        await api('/api/categories', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: document.getElementById('c-name').value.trim() }) });
        document.getElementById('c-name').value = '';
        await loadCategories();
      } catch (e) { err.textContent = e.message; }
    }

    async function adjust(id, delta) {
      try {
        await api(`/api/products/${id}/stock`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ delta }) });
        await loadProducts();
      } catch (e) { alert(e.message); }
    }

    async function removeProduct(id) {
      if (!confirm('Delete this product?')) return;
      await api(`/api/products/${id}`, { method: 'DELETE' });
      await loadProducts();
    }

    function resetFilters() {
      document.getElementById('f-search').value = '';
      document.getElementById('f-category').value = '';
      loadProducts();
    }

    loadCategories().then(loadProducts);
  </script>
</body>
</html>
